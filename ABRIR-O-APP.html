    <script id="boot-js">
      // Roda antes do app: se algo impedir a abertura, mostra o motivo em vez de uma tela em branco.
      ;(function () {
        var erros = []
        var codigoFonte = false
        var LOGO =
          '<svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#c8440c"/><g fill="#fff"><rect x="12" y="41" width="40" height="6" rx="3"/><rect x="16" y="32" width="32" height="6" rx="3"/><rect x="20" y="23" width="24" height="6" rx="3"/><rect x="25" y="14" width="14" height="6" rx="3"/></g></svg>'
        function esc(t) {
          return String(t).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
          })
        }
        function anotar(t) {
          if (t && erros.length < 3) erros.push(String(t).slice(0, 240))
        }
        function mostrar() {
          var boot = document.getElementById('boot')
          if (!boot) return // o app já abriu
          var caixa = boot.querySelector('.caixa')
          if (!caixa) return
          if (location.protocol === 'file:' && document.querySelector('script[src*="src/main.jsx"]')) codigoFonte = true
          if (codigoFonte) {
            caixa.innerHTML =
              LOGO +
              '<h1>Este arquivo é o código-fonte</h1><p>Ele não abre sozinho. Feche esta aba e dê dois cliques no arquivo <b>ABRIR-O-APP.html</b>, que está nesta mesma pasta.</p>'
            return
          }
          caixa.innerHTML =
            LOGO +
            '<h1>O app não terminou de abrir</h1><p>Toque em Recarregar. Se continuar assim, mande um print desta tela.</p>' +
            (erros.length ? '<code>' + esc(erros.join(' · ')) + '</code>' : '') +
            '<button type="button" id="boot-recarregar">Recarregar</button>'
          var b = document.getElementById('boot-recarregar')
          if (b)
            b.addEventListener('click', function () {
              location.reload()
            })
        }
        window.addEventListener(
          'error',
          function (e) {
            var alvo = e && e.target
            if (alvo && alvo !== window && alvo.tagName) {
              var url = alvo.src || alvo.href || ''
              if (/src\/main\.jsx/.test(url)) {
                codigoFonte = true
                mostrar()
              } else if (alvo.tagName === 'SCRIPT') {
                anotar('Não carregou: ' + url)
                setTimeout(mostrar, 1500)
              }
              return
            }
            anotar(e && (e.message || (e.error && e.error.message)))
            setTimeout(mostrar, 1500)
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason
          anotar(r && (r.message || r))
        })
        setTimeout(mostrar, 9000)
      })()
    </script>
    <style id="boot-css">
      body { margin: 0; }
      #boot { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #e8edef; color: #33424b; font: 15px/1.5 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      #boot .caixa { max-width: 440px; display: grid; gap: 12px; justify-items: center; }
      #boot h1 { margin: 0; font-size: 1.3rem; color: #121a1f; }
      #boot p { margin: 0; }
      #boot code { font-size: 12px; color: #5b6970; word-break: break-word; }
      #boot button { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 10px; background: #c8440c; color: #fff; cursor: pointer; }
      #boot .giro { width: 28px; height: 28px; border: 3px solid #d2dade; border-top-color: #c8440c; border-radius: 50%; animation: boot-giro 0.8s linear infinite; }
      @keyframes boot-giro { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-aparencia='claro']) #boot { background: #0e1316; color: #c4cfd5; }
        :root:not([data-theme='light']):not([data-aparencia='claro']) #boot h1 { color: #e7edf0; }
        :root:not([data-theme='light']):not([data-aparencia='claro']) #boot code { color: #8d9ea6; }
        :root:not([data-theme='light']):not([data-aparencia='claro']) #boot button { background: #ff7f45; color: #1d0c03; }
        :root:not([data-theme='light']):not([data-aparencia='claro']) #boot .giro { border-color: #29353c; border-top-color: #ff7f45; }
      }

uto tem preço de venda definido à mão, ele não muda: revise esse preço.","Orçamentos e pedidos já registrados guardam os valores combinados e não mudam."]}]},{titulo:"Cálculo e preço",itens:[{p:"De onde tiro o peso e o tempo?",r:["Do fatiador (Bambu Studio, OrcaSlicer, PrusaSlicer, Cura, Chitubox…). Use os números da mesa inteira, com suportes, e informe quantas unidades saem juntas: o app divide os custos entre elas.","Para um produto feito de partes diferentes, use “Adicionar peça”."]},{p:"Imprimo multicolor (AMS/MMU). Como lanço?",r:["Adicione cada filamento com as gramas dele e informe a purga (material descartado nas trocas de cor) no campo próprio. Confira se o peso que você copiou já não inclui a purga, para não contar duas vezes."]},{p:"Como são calculados energia, máquina e manutenção?",r:["Energia: consumo médio (kW) × horas de impressão × tarifa.","Máquina: valor da impressora ÷ horas em que ela precisa se pagar (prazo em meses × horas por dia × dias por mês, ou a vida útil em horas) × horas de impressão.","Manutenção: uma reserva anual de 5% a 25% do valor da máquina (FDM) ou 4% a 16% (resina), conforme o nível de uso, dividida pelas horas de uso do ano.","Na resina também entram a tela LCD (preço ÷ vida útil em horas), o filme FEP (preço ÷ impressões que ele aguenta) e a estação de lavagem e cura."]},{p:"O que é a reserva para falhas?",r:["Um acréscimo sobre material, purga, energia, máquina e manutenção para cobrir impressões perdidas. Cada impressora tem um padrão e você pode ajustar em uma peça específica."]},{p:"Markup ou margem?",r:["O markup multiplica o custo: 2× sobre R$ 10 dá R$ 20. Isso não é 100% de margem.","A margem é o lucro dividido pelo preço, depois do imposto. O painel mostra os dois. Se preferir, digite o preço final e veja o lucro que sobra."]},{p:"Por que o preço no marketplace é maior?",r:["O preço por canal cobre a comissão, a taxa fixa por unidade e o imposto, para sobrar o mesmo lucro da venda direta.","Na Shopee a taxa muda por faixa de preço. Quando a sugestão cai numa faixa mais cara, o app avisa quanto sobraria vendendo no topo da faixa anterior.","As taxas são referências editáveis em Meu negócio → Canais de venda. Elas não são sincronizadas com as plataformas."]}]},{titulo:"Catálogo e SKU",itens:[{p:"Cálculo salvo × catálogo",r:["Todo cálculo salvo fica em Cálculos. Os que você vende com frequência você promove ao catálogo (a estrela), onde ganham foto, descrição e SKU."]},{p:"Como gerar o SKU?",r:["Abra o produto no catálogo, use “Gerar SKU” (ou digite o seu), clique em “Revisar SKU” e depois em “Confirmar e salvar”. O código não muda se você renomear o produto ou recalcular o preço. SKU não é código de barras."]},{p:"Exportar vários cálculos",r:["Em Cálculos ou no Catálogo, clique em Selecionar, marque os itens e exporte em PDF (ficha de custo, uso interno) ou Excel. São até 500 itens por vez."]}]},{titulo:"Orçamentos",itens:[{p:"Como enviar um orçamento em PDF?",r:["Em Orçamentos → Novo orçamento, escolha o cliente e os produtos e confira quantidades, preços, envio e condições. Depois de gerar, use “Compartilhar ou salvar PDF”. No celular abre o compartilhamento; no computador, o arquivo é baixado."]},{p:"Já tenho uma numeração própria",r:["Em Orçamentos → Numeração, informe o próximo número. Se o último foi 100, use 101. A sequência só avança e não altera os documentos anteriores."]},{p:"Minha logo no orçamento",r:["Envie a logo em Meu negócio e marque “Usar a logo nos orçamentos”."]}]},{titulo:"Pedidos e clientes",itens:[{p:"O cliente aprovou. E agora?",r:["No orçamento, clique em “Cliente aprovou: criar pedido”. Os preços vêm do orçamento, sem recalcular. Confira envio, desconto e prazo, marque a confirmação e clique em Confirmar pedido. Cada orçamento vira um único pedido."]},{p:"Venda sem orçamento",r:["Em Pedidos → Novo pedido, escolha “Do catálogo”, adicione os produtos e ajuste os preços combinados."]},{p:"Etapas e correções",r:["O pedido anda em Confirmado → Em preparo → Pronto → Entregue. Errou? Use “Corrigir etapa” ou, se já entregou, “Reabrir pedido”, com o motivo. Etapa e pagamento são separados: entregar não registra recebimento."]},{p:"Sinal e pagamento",r:["Use “Registrar recebimento” com valor, data e meio. Dá para lançar um sinal e o restante depois; o saldo a receber se atualiza. Nada é cobrado automaticamente."]},{p:"Cancelamento e devolução",r:["Cancelar guarda itens, valores e histórico, mas não devolve dinheiro. Se devolver algo ao cliente, faça fora do app e use “Registrar devolução”."]},{p:"Aviso pelo WhatsApp",r:["No pedido, clique em “Avisar cliente pelo WhatsApp”, confira número e mensagem da etapa e abra o WhatsApp. O envio é manual: mudar a etapa não manda nada sozinho."]},{p:"Arquivar cliente",r:["Arquivar tira o cliente da lista de novos pedidos, mas o histórico fica. Dá para reativar depois."]}]},{titulo:"Imagens com IA",itens:[{p:"Como criar a foto do produto em outro ambiente?",r:["Fotografe a peça inteira, com boa luz e fundo liso. Em Imagens com IA, envie a foto (ou use a de um produto), descreva o produto em poucas palavras e escolha a cena.","Informe a sua chave do Google AI Studio (Gemini) ou da OpenAI. Ela fica só neste navegador. O custo de cada imagem é cobrado na sua conta do provedor.","Clique em “Revisar antes de gerar” e confirme. Compare o resultado com a foto original antes de usar em anúncios."]},{p:"Usar a imagem no catálogo",r:["No resultado ou em Minhas imagens, use “Associar a um produto”. A foto anterior é substituída; custo e preço não mudam."]}]},{titulo:"Planilhas (Excel)",itens:[{p:"Como cadastro vários filamentos de uma vez?",r:["Em Planilhas (ou Meu QG → Importar planilha), baixe a tabela modelo.","No Excel, preencha uma linha por material (pode colar da sua planilha, mantendo os títulos das colunas). Nome e preço bastam.","Volte ao app, clique em Importar planilha e escolha o arquivo. O app mostra o que é novo, o que atualiza e o que tem erro. Confira e clique em Importar."]},{p:"
